# Builds the APKs on every push. Open the Actions tab -> latest run -> download "YTPlayer-apks".
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YTPlayer-apks
          path: app/build/outputs/apk/release/*.apk

      # Publishes the APKs as a GitHub Release so they can be downloaded directly on a phone
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/*.apk \
            --title "YT Player (latest build)" \
            --notes "Most phones: install app-arm64-v8a-release.apk. Older 32-bit phones: armeabi-v7a."
