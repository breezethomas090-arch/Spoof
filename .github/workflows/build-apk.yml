# Builds the APKs on every push. Open the Actions tab -> latest run -> download "Audify-apks".
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One signing key for every build, kept in the repo's private Actions cache (not in the code),
      # so each new APK installs over the previous one.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: keystore/audify.jks
          key: audify-signing-key-v1

      - name: Create signing key (first build only)
        env:
          KS_PASS: audify-release
        run: |
          mkdir -p keystore
          if [ ! -f keystore/audify.jks ]; then
            keytool -genkeypair -keystore keystore/audify.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -alias audify -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Audify"
          fi

      - name: Build release APKs
        env:
          AUDIFY_KEYSTORE: ${{ github.workspace }}/keystore/audify.jks
          AUDIFY_KEY_PASS: audify-release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name APKs by timestamp
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M)
          cd app/build/outputs/apk/release
          for f in app-*-release.apk; do
            abi=${f#app-}; abi=${abi%-release.apk}
            mv "$f" "Audify-$STAMP-$abi.apk"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: Audify-apks
          path: app/build/outputs/apk/release/Audify-*.apk

      # Publishes the APKs as a GitHub Release so they can be downloaded directly on a phone
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/Audify-*.apk \
            --title "Audify (latest build)" \
            --notes "Most phones: install the arm64-v8a APK. Older 32-bit phones: armeabi-v7a. New versions install over old ones."
